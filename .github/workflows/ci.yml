name: CI

# Fast, always-on gate: runs on every push to main and every PR. No secrets,
# no network LLM calls — pure unit + offline-eval suite (the retrieval tests
# auto-skip when sentence-transformers isn't installed).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pytest pyjwt fastapi langchain-openai langgraph \
            langchain-mcp-adapters mcp fastmcp openai requests \
            tavily-python ddgs python-dotenv dotenv uvicorn

      - name: Run test suite (incl. offline eval gate)
        run: python -m pytest -q
