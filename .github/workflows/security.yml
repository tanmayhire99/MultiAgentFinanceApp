name: Security

# Secret scanning — prevents API keys / credentials from reaching (or lingering
# in) the public repo. Runs on every push and PR, scanning the FULL history
# (fetch-depth: 0) so a secret introduced in any commit is caught, not just the
# diff. This is the guard that would have flagged the hardcoded NVIDIA key.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
