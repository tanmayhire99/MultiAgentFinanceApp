[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.128.0",
    "fastmcp>=3.2.4",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.1",
    "langgraph>=1.0.7",
    "mcp>=1.27.0",
    "openai>=2.15.0",
    "requests>=2.32.5",
    "tavily-python>=0.3",
    "ddgs>=6.0",
    "sentence-transformers>=2.2",
    "torch>=2.9.1",
    "torchaudio>=2.9.1",
    "torchvision>=0.24.1",
    "uvicorn>=0.40.0",
]
[tool.uv]
environments = ['sys_platform == "linux"']

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
