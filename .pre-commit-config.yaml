# Local guardrails. Install once per clone:
#     pip install pre-commit && pre-commit install
# Then these run on every commit; `pre-commit run --all-files` scans everything.
#
# gitleaks blocks hardcoded secrets (API keys, tokens) from being committed —
# the local complement to .github/workflows/security.yml.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
