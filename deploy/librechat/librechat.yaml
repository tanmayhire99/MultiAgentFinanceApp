# LibreChat Configuration for FinAI Integration
# Version: 1.3.5

version: 1.3.5

cache: true

interface:
  endpointsMenu: true
  modelSelect: true
  sidePanel: true
  agents:
    use: true

endpoints:
  agents:
    recursionLimit: 25
    maxRecursionLimit: 50
    disableBuilder: false
    capabilities:
      - "execute_code"
      - "file_search"
      - "actions"
      - "tools"
      - "artifacts"
      - "context"
      - "web_search"

custom:
- name: "FinAI"
  apiKey: "finai-production"
  baseURL: "http://finai-api:8000/v1"
  headers:
    X-LibreChat-Token: "{{LIBRECHAT_JWT}}"
  models:
    default:
    - "finai-advisor"
  fetch: false
  titleConvo: true
  titleModel: "current_model"
  modelDisplayLabel: "FinAI Advisor"
  dropParams:
  - "stop"
